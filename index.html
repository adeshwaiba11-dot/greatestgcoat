<script src="script.js"></script>



<!-- =========================================
     WELCOME TYPING SYSTEM
========================================= -->

<script>


/* ELEMENTS */

const systemText =
    document.getElementById("systemText");

const mainTitle =
    document.getElementById("mainTitle");

const subtitle =
    document.getElementById("subtitle");

const divider =
    document.getElementById("divider");

const intro =
    document.getElementById("intro");

const status1 =
    document.getElementById("status1");

const status2 =
    document.getElementById("status2");

const status3 =
    document.getElementById("status3");

const status4 =
    document.getElementById("status4");

const warning =
    document.getElementById("warning");

const enterText =
    document.getElementById("enterText");

const enterButton =
    document.getElementById("enterButton");



/* TYPE FUNCTION */

function typeText(element, text, speed){

    return new Promise(function(resolve){

        let i = 0;


        function write(){

            if(i < text.length){

                element.textContent =
                    text.substring(0, i + 1);

                i++;

                setTimeout(write, speed);

            }

            else{

                resolve();

            }

        }


        write();

    });

}



/* DELAY */

function delay(ms){

    return new Promise(function(resolve){

        setTimeout(resolve, ms);

    });

}



/* START */

async function startWelcome(){


    /* 1 */

    await typeText(
        systemText,
        "[ CONNECTION ESTABLISHED ]",
        55
    );


    await delay(600);



    /* 2 */

    await typeText(
        mainTitle,
        "GREATESTGCOAT",
        80
    );


    await delay(500);



    /* 3 */

    await typeText(
        subtitle,
        "Welcome to the community archive.",
        45
    );


    await delay(400);



    /* 4 */

    await typeText(
        divider,
        "────────────────────────────",
        20
    );


    await delay(400);



    /* 5 */

    await typeText(
        intro,
        "A space built around the anime, manga,",
        40
    );


    intro.innerHTML += "<br>";


    await typeText(
        intro,
        "and stories we enjoy together.",
        40
    );


    await delay(600);



    /* STATUS */

    await typeText(
        status1,
        "ANIME COLLECTION     ✓",
        35
    );


    await delay(180);


    await typeText(
        status2,
        "MANGA ARCHIVE        ✓",
        35
    );


    await delay(180);


    await typeText(
        status3,
        "COMMUNITY ACCESS     ✓",
        35
    );


    await delay(180);


    await typeText(
        status4,
        "SYSTEM STATUS        ONLINE",
        35
    );


    await delay(700);



    /* FINAL */

    await typeText(
        warning,
        "WELCOME, MEMBER.",
        55
    );


    await delay(500);


    await typeText(
        enterText,
        "ACCESS THE ARCHIVE.",
        50
    );


    await delay(500);


    /* BUTTON */

    enterButton.style.display =
        "block";

}



/* ENTER */

function enterDomain(){

    const welcome =
        document.querySelector(".welcome-screen");

    const archive =
        document.getElementById("anime-domain");


    welcome.style.transition =
        "opacity 0.5s ease";

    welcome.style.opacity =
        "0";


    setTimeout(function(){

        welcome.style.display =
            "none";

        archive.style.display =
            "flex";

    }, 500);

}



/* START TYPING */

startWelcome();


</script>
