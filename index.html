<!-- =========================================
     WELCOME TYPING SYSTEM
========================================= -->

<script>

const systemText =
    document.getElementById("systemText");

const welcomeLabel =
    document.getElementById("welcomeLabel");

const mainTitle =
    document.getElementById("mainTitle");

const subtitle =
    document.getElementById("subtitle");

const arrow =
    document.getElementById("arrow");

const accessMessage =
    document.getElementById("accessMessage");

const activation =
    document.getElementById("activation");

const divider1 =
    document.getElementById("divider1");

const divider2 =
    document.getElementById("divider2");

const divider3 =
    document.getElementById("divider3");

const status1 =
    document.getElementById("status1");

const status2 =
    document.getElementById("status2");

const status3 =
    document.getElementById("status3");

const status4 =
    document.getElementById("status4");

const creatorTitle =
    document.getElementById("creatorTitle");

const creatorName =
    document.getElementById("creatorName");

const warning =
    document.getElementById("warning");

const enterText =
    document.getElementById("enterText");

const enterButton =
    document.getElementById("enterButton");



/* TYPE FUNCTION */

function typeText(element, text, speed){

    return new Promise(function(resolve){

        let i = 0;

        function write(){

            if(i < text.length){

                element.textContent =
                    text.substring(0, i + 1);

                i++;

                setTimeout(write, speed);

            }

            else{

                resolve();

            }

        }

        write();

    });

}



/* DELAY */

function delay(ms){

    return new Promise(function(resolve){

        setTimeout(resolve, ms);

    });

}



/* START */

async function startWelcome(){


    await typeText(
        systemText,
        "[ CONNECTION ESTABLISHED ]",
        55
    );

    await delay(500);



    await typeText(
        welcomeLabel,
        "WELCOME TO",
        70
    );

    await delay(350);



    await typeText(
        mainTitle,
        "█ GREATESTGCOAT █",
        75
    );

    await delay(300);



    await typeText(
        subtitle,
        "// ANIME DOMAIN //",
        55
    );

    await delay(450);



    await typeText(
        arrow,
        "↓",
        80
    );

    await delay(300);



    await typeText(
        accessMessage,
        "STILL IN DEVELOPMENT —",
        40
    );

    await typeText(
        accessMessage,
        "STILL IN DEVELOPMENT — ARTHUR JUST GRANTED THIS GROUP EARLY ACCESS.",
        25
    );

    await delay(500);



    await typeText(
        activation,
        "THE DOMAIN HAS BEEN ACTIVATED.",
        45
    );

    await delay(500);



    await typeText(
        divider1,
        "────────────────────────────",
        15
    );

    await delay(250);



    await typeText(
        status1,
        "MANHWA ARCHIVE          ✓",
        30
    );

    await delay(150);


    await typeText(
        status2,
        "MANGA ARCHIVE           ✓",
        30
    );

    await delay(150);


    await typeText(
        status3,
        "COMMUNITY ACCESS        ✓",
        30
    );

    await delay(150);


    await typeText(
        status4,
        "SYSTEM STATUS           ONLINE",
        30
    );

    await delay(500);



    await typeText(
        divider2,
        "────────────────────────────",
        15
    );

    await delay(350);



    await typeText(
        creatorTitle,
        "CREATED & DESIGNED BY",
        45
    );

    await delay(250);



    await typeText(
        creatorName,
        "MIMO'S LOVERBOI — KSHITIZ",
        50
    );

    await delay(450);



    await typeText(
        divider3,
        "────────────────────────────",
        15
    );

    await delay(400);



    await typeText(
        warning,
        "YOU WERE NOT SUPPOSED TO FIND THIS.",
        45
    );

    await delay(400);



    await typeText(
        enterText,
        "ACCESS THE ARCHIVE",
        45
    );

    await delay(500);



    enterButton.style.display = "block";

}



/* ENTER */

function enterDomain(){

    const welcome =
        document.querySelector(".welcome-screen");

    const archive =
        document.getElementById("anime-domain");


    welcome.style.transition =
        "opacity 0.5s ease";

    welcome.style.opacity =
        "0";


    setTimeout(function(){

        welcome.style.display =
            "none";

        archive.style.display =
            "flex";

    }, 500);

}



/* START */

startWelcome();

</script>
