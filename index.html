        id="enterButton"
        onclick="enterDomain()"
        style="display:none;">
        ENTER ARCHIVE
    </button>

</div>

     ANIME ARCHIVE
========================================= -->

    <!-- Background Music -->

    <audio id="bgMusic" loop>

    <!-- Attack on Titan -->

    <div

            target="_blank">

            Read Manga

        </a>

    </div>



    <!-- Chainsaw Man -->

    <div
        class="panel"

    <!-- Solo Leveling -->

    <div

<!-- =========================================
     EXISTING SCRIPT
========================================= -->

<script src="script.js"></script>



<!-- =========================================
     ENTER DOMAIN
========================================= -->

<script>

function enterDomain(){

    const welcome =
        document.querySelector(".welcome-screen");

    const domain =
        document.getElementById("anime-domain");


    welcome.style.opacity = "0";


    setTimeout(() => {

        welcome.style.display = "none";

        domain.style.display = "flex";

    }, 500);

}

</script>



<!-- =========================================
     TYPING INTRO
========================================= -->

<script>

const systemText =
    document.getElementById("systemText");

const mainTitle =
    document.getElementById("mainTitle");

const subtitle =
    document.getElementById("subtitle");

const divider =
    document.getElementById("divider");

const intro =
    document.getElementById("intro");

const statusBox =
    document.getElementById("statusBox");

const warning =
    document.getElementById("warning");

const enterText =
    document.getElementById("enterText");

const enterButton =
    document.getElementById("enterButton");



/* =========================================
   TYPE FUNCTION
========================================= */

function typeText(element, text, speed = 45){

    return new Promise(resolve => {

        let index = 0;


        function type(){

            if(index < text.length){

                element.textContent +=
                    text[index];

                index++;

                setTimeout(type, speed);

            }

            else{

                resolve();

            }

        }


        type();

    });

}



/* =========================================
   DELAY
========================================= */

function wait(time){

    return new Promise(resolve => {

        setTimeout(resolve, time);

    });

}



/* =========================================
   START INTRO
========================================= */

async function startIntro(){


    /* Connection */

    await typeText(
        systemText,
        "[ CONNECTION ESTABLISHED ]",
        55
    );


    await wait(500);



    /* Main title */

    await typeText(
        mainTitle,
        "GREATESTGCOAT",
        85
    );


    await wait(450);



    /* Subtitle */

    await typeText(
        subtitle,
        "Welcome to the community archive.",
        45
    );


    await wait(350);



    /* Divider */

    await typeText(
        divider,
        "────────────────────────────",
        20
    );


    await wait(350);



    /* Intro */

    await typeText(
        intro,
        "A space built around the anime, manga,",
        38
    );


    intro.innerHTML += "<br>";


    await typeText(
        intro,
        "and stories we enjoy together.",
        38
    );


    await wait(500);



    /* Status */

    const statusLines = [

        "ANIME COLLECTION     ✓",

        "MANGA ARCHIVE        ✓",

        "COMMUNITY ACCESS     ✓",

        "SYSTEM STATUS        ONLINE"

    ];


    for(const text of statusLines){

        const row =
            document.createElement("p");


        statusBox.appendChild(row);


        await typeText(
            row,
            text,
            35
        );


        await wait(160);

    }


    await wait(600);



    /* Final message */

    await typeText(
        warning,
        "WELCOME, MEMBER.",
        55
    );


    await wait(400);


    await typeText(
        enterText,
        "ACCESS THE ARCHIVE.",
        50
    );


    await wait(500);



    /* Show button */

    enterButton.style.display =
        "block";


}



/* Start */

startIntro();

</script>


</body>

</html>
